[project]
name = "meshguard"
version = "0.1.0"
description = "Autonomous investigation of and response to anomalies in microservice communication"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "matw0x" }]
dependencies = [
    "anthropic>=2.8.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "typer>=0.29.0",
]

[project.optional-dependencies]
openai = [
    "openai>=3.49.0",
]

[project.scripts]
meshguard = "meshguard.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
report = [
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PL", "PT", "RET", "TC",
    "PERF", "FURB", "ASYNC", "S", "DTZ", "PTH", "LOG", "G", "T20", "ARG", "ERA",
]
ignore = [
    "PLR0913",  # explicit keyword-only configuration is clearer than parameter objects here
    "PLR2004",
    "S311",     # simulation uses non-cryptographic RNG by design
    "RUF001",   # Russian captions in figures
    "TC",       # annotations are lazy on 3.14 and pydantic/typer/dataclasses introspect them at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"src/meshguard/cli.py" = ["PLR0917"]  # typer derives options from the signature
"docs/**" = ["T20", "S", "PLR0917"]  # geometry-heavy drawing helpers

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["meshguard"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
